plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'androidParkzen-core'
version = '0.7.9'

android {
  namespace "expo.modules.parkzencore"
  defaultConfig {
    versionCode 1
    versionName "0.7.9"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  //tell android to look in the local folder for the .aar file
  implementation files('libs/parkzen-core-0.1.aar')
}
