plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'androidParkzen-core'
version = '0.7.9'

android {
  namespace "expo.modules.parkzencore"
  defaultConfig {
    versionCode 1
    versionName "0.7.9"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  //ParkZenCore SDK from ParkZen's GitHub Packages repo; the repo and its
  //credentials are added to android/build.gradle by app.config.js
  implementation("com.parkzenlib:parkzen-core-dist:1.0.4")
  //ParkZenCore.requestPermissions() takes a ComponentActivity; a low floor
  //version so this never upgrades the one React Native already ships
  implementation("androidx.activity:activity:1.8.0")
}
