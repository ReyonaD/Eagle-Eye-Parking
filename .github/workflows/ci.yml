# Runs on every pull request and every push to main.
# Backend: pytest API tests against a throwaway PostgreSQL service, with coverage
#          (no secrets or live database needed).
# Frontend: TypeScript type check, lint, and unit tests with coverage.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EagleEyes/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eagleeyes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/eagleeyes_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            EagleEyes/backend/requirements.txt
            EagleEyes/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      # Fails if coverage drops below fail_under in .coveragerc.
      - name: Run tests
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: EagleEyes/backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend checks & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EagleEyes/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EagleEyes/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Fails on critical issues only: the remaining high/moderate ones are in Expo SDK 54's
      # build tooling and need an SDK upgrade (Dependabot alerts track them).
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Fails if coverage drops below the floor set in package.json (jest.coverageThreshold).
      - name: Unit tests
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: EagleEyes/frontend/coverage/
          if-no-files-found: ignore
